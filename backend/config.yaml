llm:
  fallback_chain: [openrouter]
  fallback_models:
    openrouter: openai/gpt-5.4-mini
  nodes:
    retrieval_decision: { provider: openrouter, model: openai/gpt-5.4-mini }
    relevance_grader: { provider: openrouter, model: openai/gpt-5.4-mini }
    query_rewriter: { provider: openrouter, model: openai/gpt-5.4-mini }
    answer_generator: { provider: openrouter, model: openai/gpt-5.4-mini }
    hallucination_grader: { provider: openrouter, model: openai/gpt-5.4-mini }
    research_planner: { provider: openrouter, model: openai/gpt-5.4-mini }
    research_executor: { provider: openrouter, model: openai/gpt-5.4-mini }
    research_synthesizer: { provider: openrouter, model: openai/gpt-5.4-mini }
  timeouts_ms:
    default: 12000
    generation: 25000
  retries:
    transient_max: 1

pipeline:
  rewrite_max_attempts: 3
  hallucination_max_retries: 2
  relevance_threshold: 0.5
  node_timeout_ms: 30000
  retrieval:
    top_k_per_namespace: 5
    merged_top_n: 10
  research:
    enabled: true
    max_sub_questions: 3
    max_hops: 1
    synthesizer_max_docs: 12

embedding:
  active_provider: openrouter
  active_model: openai/text-embedding-3-small
  dimensions: 1536
  enforce_ingest_alignment: true

prompts:
  nodes:
    retrieval_decision:
      id: retrieval_decision
      version: v1
      path: templates/retrieval_decision/v1.txt
    relevance_grader:
      id: relevance_grader
      version: v1
      path: templates/relevance_grader/v1.txt
    query_rewriter:
      id: query_rewriter
      version: v1
      path: templates/query_rewriter/v1.txt
    answer_generator:
      id: answer_generator
      version: v1
      path: templates/answer_generator/v1.txt
    answer_generator_parametric:
      id: answer_generator_parametric
      version: v1
      path: templates/answer_generator_parametric/v1.txt
    hallucination_grader:
      id: hallucination_grader
      version: v1
      path: templates/hallucination_grader/v1.txt
    research_planner:
      id: research_planner
      version: v1
      path: templates/research_planner/v1.txt
    research_synthesizer:
      id: research_synthesizer
      version: v1
      path: templates/research_synthesizer/v1.txt
