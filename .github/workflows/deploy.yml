name: deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Release action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      staging_validation_run:
        description: "Required for production deploys: staging run ID or changelog ref"
        required: false
        type: string
      rollback_revision:
        description: "Required for rollback: previously deployed revision"
        required: false
        type: string

jobs:
  predeploy-gates:
    if: ${{ github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CI workflow succeeded on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: sha, per_page: 100 });
            const ciRun = runs.data.workflow_runs.find((run) => run.name === "ci");
            if (!ciRun) {
              core.setFailed("No CI run found for this commit.");
              return;
            }
            if (ciRun.conclusion !== "success") {
              core.setFailed(`CI run conclusion is ${ciRun.conclusion}; deploy blocked.`);
            }
      - name: Require staged promotion evidence for production
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          test -n "${{ github.event.inputs.staging_validation_run }}"

  deploy:
    if: ${{ github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    needs: predeploy-gates
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release checklist
        run: test -f docs/runbooks/release_checklist.md

      - name: Deploy to staging
        if: ${{ github.event.inputs.environment == 'staging' }}
        env:
          DEPLOY_COMMAND: ${{ vars.STAGING_DEPLOY_COMMAND }}
        run: |
          test -n "$DEPLOY_COMMAND"
          bash -lc "$DEPLOY_COMMAND"

      - name: Deploy to production
        if: ${{ github.event.inputs.environment == 'production' }}
        env:
          DEPLOY_COMMAND: ${{ vars.PRODUCTION_DEPLOY_COMMAND }}
        run: |
          test -n "$DEPLOY_COMMAND"
          bash -lc "$DEPLOY_COMMAND"

      - name: Post-deploy smoke checks
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          test -n "$SMOKE_BASE_URL"
          curl --fail --silent "$SMOKE_BASE_URL/api/v1/health" > /tmp/health.json
          curl --fail --silent "$SMOKE_BASE_URL/api/v1/ready" > /tmp/ready.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health.json').read_text())
          ready = json.loads(Path('/tmp/ready.json').read_text())
          assert health.get('status') == 'ok', health
          assert ready.get('status') == 'ready', ready
          print('Smoke checks passed')
          PY

  rollback:
    if: ${{ github.event.inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback inputs
        run: test -n "${{ github.event.inputs.rollback_revision }}"

      - name: Execute rollback
        env:
          ROLLBACK_COMMAND: ${{ vars.ROLLBACK_COMMAND }}
          ROLLBACK_REVISION: ${{ github.event.inputs.rollback_revision }}
        run: |
          test -n "$ROLLBACK_COMMAND"
          bash -lc "$ROLLBACK_COMMAND $ROLLBACK_REVISION"

      - name: Post-rollback smoke checks
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          test -n "$SMOKE_BASE_URL"
          curl --fail --silent "$SMOKE_BASE_URL/api/v1/health" > /tmp/health.json
          curl --fail --silent "$SMOKE_BASE_URL/api/v1/ready" > /tmp/ready.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health.json').read_text())
          ready = json.loads(Path('/tmp/ready.json').read_text())
          assert health.get('status') == 'ok', health
          assert ready.get('status') == 'ready', ready
          print('Rollback smoke checks passed')
          PY
