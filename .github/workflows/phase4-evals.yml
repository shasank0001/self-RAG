name: phase4-evals

on:
  pull_request:
    paths:
      - "backend/app/pipeline/**"
      - "backend/app/router/**"
      - "backend/app/pipeline/prompts/**"
      - "backend/tests/test_phase4_*.py"
      - "backend/tests/evals/**"
      - "backend/config.yaml"

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Run Phase 4 eval harness
        run: uv run python scripts/run_phase4_evals.py

      - name: Upload eval report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-eval-report
          path: backend/tests/evals/phase4_eval_report.json
